<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password - Smart Parking</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link th:href="@{/css/ui-fixes.css}" rel="stylesheet">
<style>body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#090d16;color:#f1f5f9;font-family:Arial,sans-serif;padding:20px}.card-reset{max-width:460px;width:100%;background:#1e293b;border:1px solid #334155;border-radius:20px;padding:32px;box-shadow:0 20px 50px #0008}.form-control{background:#0f172a!important;color:#fff!important;border-color:#475569!important}.form-control::placeholder{color:#94a3b8}</style>
</head><body>
<div class="card-reset">
<h2 class="fw-bold mb-2">Forgot Password?</h2><p class="text-secondary">Enter your registered email and we will send a secure reset link.</p>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
<div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>
<form th:action="@{/forgot-password}" method="post">
<label class="form-label">Email address</label>
<input type="email" name="email" class="form-control mb-3" placeholder="you@example.com" required autocomplete="email">
<button class="btn btn-primary w-100">Send Reset Link</button>
</form>
<div class="text-center mt-3"><a href="/login" class="text-primary text-decoration-none">Back to Login</a></div>
</div></body></html>
