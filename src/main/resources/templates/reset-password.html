<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password - Smart Parking</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#090d16;color:#f1f5f9;font-family:Arial,sans-serif;padding:20px}.card-reset{max-width:460px;width:100%;background:#1e293b;border:1px solid #334155;border-radius:20px;padding:32px;box-shadow:0 20px 50px #0008}.form-control{background:#0f172a!important;color:#fff!important;border-color:#475569!important}.form-control::placeholder{color:#94a3b8}</style>
</head><body>
<div class="card-reset">
<h2 class="fw-bold mb-2">Create New Password</h2>
<div th:if="${!tokenValid}" class="alert alert-danger">This reset link is invalid or expired. Please request a new link.</div>
<div th:if="${tokenValid}">
<p class="text-secondary">Choose a new password for your account.</p>
<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<form th:action="@{/reset-password}" method="post">
<input type="hidden" name="token" th:value="${token}">
<label class="form-label">New password</label>
<input type="password" name="password" class="form-control mb-3" minlength="6" required autocomplete="new-password">
<label class="form-label">Confirm password</label>
<input type="password" name="confirmPassword" class="form-control mb-3" minlength="6" required autocomplete="new-password">
<button class="btn btn-primary w-100">Reset Password</button>
</form>
</div>
<div class="text-center mt-3"><a href="/login" class="text-primary text-decoration-none">Back to Login</a></div>
</div></body></html>
