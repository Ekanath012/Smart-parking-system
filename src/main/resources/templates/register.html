<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Smart Parking Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/ui-fixes.css}" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: #f1f5f9;
        }
        .register-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            max-width: 480px;
            width: 100%;
            padding: 2.5rem;
        }
        .brand-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: white;
            margin: 0 auto 1.25rem auto;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
        }
        .field-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
            display: block;
        }
        .input-group-custom {
            position: relative;
        }
        .form-control-custom {
            background: #0f172a !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
            padding: 0.75rem 1rem 0.75rem 2.8rem !important;
            border-radius: 12px !important;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control-custom::placeholder {
            color: #94a3b8 !important;
            opacity: 1 !important;
        }
        .form-control-custom:focus {
            background: #0f172a !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25) !important;
            color: #ffffff !important;
        }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #60a5fa;
            z-index: 5;
            font-size: 1rem;
        }
        .btn-register {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
            color: white;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="brand-logo">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h3 class="text-center fw-bold mb-1">Create Account</h3>
        <p class="text-center text-secondary mb-4 fs-7">Register to book parking slots instantly</p>

        <!-- Error Alert: Only rendered when errorMessage exists and is non-empty -->
        <th:block th:if="${errorMessage != null and #strings.length(errorMessage) > 0}">
            <div class="alert alert-danger border-0 bg-danger bg-opacity-20 text-danger fs-7 rounded-3 mb-4">
                <i class="fa-solid fa-circle-exclamation me-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>
        </th:block>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${userDto}" method="post">
            
            <!-- Full Name -->
            <div class="mb-3">
                <label for="name" class="field-label"><i class="fa-solid fa-user me-1 text-primary"></i> Full Name</label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="name" th:field="*{name}" class="form-control form-control-custom" placeholder="e.g. Ekanath Anehosur" required>
                </div>
                <div class="text-danger fs-8 mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <!-- Email Address -->
            <div class="mb-3">
                <label for="email" class="field-label"><i class="fa-solid fa-envelope me-1 text-primary"></i> Email Address</label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" th:field="*{email}" class="form-control form-control-custom" placeholder="e.g. user@example.com" required>
                </div>
                <div class="text-danger fs-8 mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
                <label for="phone" class="field-label"><i class="fa-solid fa-phone me-1 text-primary"></i> Phone Number</label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control form-control-custom" placeholder="e.g. 9876543210" required>
                </div>
                <div class="text-danger fs-8 mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="field-label"><i class="fa-solid fa-lock me-1 text-primary"></i> Password</label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" th:field="*{password}" class="form-control form-control-custom" placeholder="Enter password (minimum 6 characters)" required>
                </div>
                <div class="text-danger fs-8 mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label for="confirmPassword" class="field-label"><i class="fa-solid fa-shield-halved me-1 text-primary"></i> Confirm Password</label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control form-control-custom" placeholder="Re-enter password to confirm" required>
                </div>
                <div class="text-danger fs-8 mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-register mb-3">
                <i class="fa-solid fa-user-check me-2"></i> Register Account
            </button>
        </form>

        <div class="text-center fs-7 text-secondary">
            Already have an account? <a href="/login" class="text-primary text-decoration-none fw-semibold">Sign in here</a>
        </div>
    </div>

</body>
</html>
