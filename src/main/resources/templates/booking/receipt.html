<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Bill Receipt - Smart Parking System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/ui-fixes.css}" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: #f1f5f9;
        }
        .receipt-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem;
        }
        .receipt-header {
            border-bottom: 2px dashed rgba(255, 255, 255, 0.15);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .receipt-footer {
            border-top: 2px dashed rgba(255, 255, 255, 0.15);
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }
        .btn-glow {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white !important;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="receipt-card">
        <!-- Receipt Header -->
        <div class="receipt-header text-center">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-20 text-success rounded-circle mb-3" style="width:60px; height:60px; font-size:1.75rem;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 class="fw-bold mb-1">Payment Receipt</h4>
            <div class="text-secondary fs-7">Smart Parking Management System</div>
            <div class="badge bg-primary bg-opacity-20 text-primary px-3 py-2 rounded-pill mt-2" th:text="${booking.bookingReference}">SPK-123456</div>
        </div>

        <!-- Receipt Body Details -->
        <div class="row g-3 mb-3 fs-7">
            <div class="col-6">
                <span class="text-secondary d-block">Driver Name</span>
                <strong class="text-light fs-6" th:text="${booking.userName}">John Doe</strong>
            </div>
            <div class="col-6 text-end">
                <span class="text-secondary d-block">Vehicle Number</span>
                <strong class="text-primary fs-6" th:text="${booking.vehicleNumber}">KA-01-AB-1234</strong>
            </div>
            <div class="col-6">
                <span class="text-secondary d-block">Slot Number</span>
                <strong class="text-light fs-6" th:text="${booking.slotNumber + ' (' + booking.slotType + ')'}">A-01 (CAR)</strong>
            </div>
            <div class="col-6 text-end">
                <span class="text-secondary d-block">Floor Level</span>
                <strong class="text-light fs-6" th:text="${booking.floorLevel}">Ground</strong>
            </div>
            <div class="col-6">
                <span class="text-secondary d-block">Check-In Time</span>
                <span class="text-slate-300" th:text="${#temporals.format(booking.entryTime, 'dd MMM yyyy, HH:mm')}">Time</span>
            </div>
            <div class="col-6 text-end">
                <span class="text-secondary d-block">Check-Out Time</span>
                <span class="text-slate-300" th:text="${#temporals.format(booking.exitTime, 'dd MMM yyyy, HH:mm')}">Time</span>
            </div>
        </div>

        <!-- Bill Line Breakdown -->
        <div class="bg-dark bg-opacity-60 rounded-3 p-3 mb-3">
            <div class="d-flex justify-content-between mb-2 fs-7 text-secondary">
                <span>Duration Billed:</span>
                <strong class="text-light" th:text="${bill.totalHours} + ' Hours (min 1 hr)'">1 Hours</strong>
            </div>
            <div class="d-flex justify-content-between mb-2 fs-7 text-secondary">
                <span>Hourly Rate:</span>
                <strong class="text-light" th:text="'₹' + ${bill.hourlyRate} + '/hr'">₹20.0/hr</strong>
            </div>
            <hr class="border-secondary opacity-25 my-2">
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-bold">Total Paid:</span>
                <span class="fw-bold fs-4 text-success" th:text="'₹' + ${bill.totalAmount}">₹20.0</span>
            </div>
        </div>

        <!-- Receipt Footer Actions -->
        <div class="receipt-footer d-flex justify-content-between align-items-center flex-wrap gap-2">
            <a href="/user/dashboard" class="btn btn-outline-secondary px-3"><i class="fa-solid fa-arrow-left me-1"></i> Dashboard</a>
            <div class="d-flex gap-2">
                <a th:href="@{/booking/pdf/{id}(id=${booking.id})}" class="btn btn-outline-primary px-3" target="_blank">
                    <i class="fa-solid fa-file-pdf me-1"></i> Download PDF
                </a>
                <button onclick="window.print()" class="btn btn-glow"><i class="fa-solid fa-print me-1"></i> Print</button>
            </div>
        </div>
    </div>

</body>
</html>
