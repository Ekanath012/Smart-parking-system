<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation - Smart Parking Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/ui-fixes.css}" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: #f1f5f9;
        }
        .confirmation-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem;
        }
        .header-box {
            border-bottom: 2px dashed rgba(255, 255, 255, 0.15);
            padding-bottom: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .qr-box {
            background: #ffffff;
            padding: 1rem;
            border-radius: 18px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .qr-img {
            width: 190px;
            height: 190px;
            display: block;
        }
        .number-plate-badge {
            background: #facc15;
            color: #0f172a;
            font-family: monospace;
            font-weight: 800;
            font-size: 1rem;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            border: 2px solid #0f172a;
            letter-spacing: 1.5px;
            display: inline-block;
        }
        .footer-box {
            border-top: 2px dashed rgba(255, 255, 255, 0.15);
            padding-top: 1.25rem;
            margin-top: 1.5rem;
        }
        .btn-glow {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white !important;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }
    </style>
</head>
<body>

    <div class="confirmation-card text-center">
        <!-- Header -->
        <div class="header-box">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-20 text-success rounded-circle mb-3" style="width:64px; height:64px; font-size:2rem;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 class="fw-bold text-white mb-1">Booking Confirmed Successfully!</h4>
            <div class="text-slate-400 fs-7">Smart Parking Management System</div>
            <div class="fw-bold text-primary fs-5 mt-2" th:text="${booking.bookingReference}">SPK-123456</div>
        </div>

        <!-- Scannable QR Code Pass -->
        <div class="mb-4">
            <div class="qr-box">
                <img th:if="${booking.qrCodeUrl != null}" th:src="${booking.qrCodeUrl}" alt="Scannable Parking Pass QR Code" class="qr-img">
                <img th:if="${booking.qrCodeUrl == null and booking.qrCodeBase64 != null}" th:src="${booking.qrCodeBase64}" alt="Scannable Parking Pass QR Code" class="qr-img">
            </div>
            <div class="mt-2">
                <a th:href="@{/booking/qr/download/{id}(id=${booking.id})}" class="btn btn-outline-light btn-sm rounded-pill px-3 mt-1">
                    <i class="fa-solid fa-download me-1"></i> Download QR Pass Image
                </a>
            </div>
        </div>

        <!-- Booking Details Breakdown -->
        <div class="row g-3 text-start fs-7 bg-dark bg-opacity-60 p-3 rounded-3 mb-3">
            <div class="col-6">
                <span class="text-slate-400 d-block">Booking ID / Ref</span>
                <strong class="text-primary fs-6" th:text="${booking.bookingReference}">SPK-123456</strong>
            </div>
            <div class="col-6 text-end">
                <span class="text-slate-400 d-block">Driver Name</span>
                <strong class="text-white fs-6" th:text="${booking.userName}">John Doe</strong>
            </div>
            <div class="col-6">
                <span class="text-slate-400 d-block">Vehicle Number</span>
                <span class="number-plate-badge mt-1" th:text="${booking.vehicleNumber}">KA-01-AB-1234</span>
            </div>
            <div class="col-6 text-end">
                <span class="text-slate-400 d-block">Assigned Slot</span>
                <strong class="text-info fs-5" th:text="${booking.slotNumber}">A-01</strong>
                <span class="badge bg-secondary ms-1 fs-8" th:text="${booking.slotType}">CAR</span>
            </div>
            <div class="col-6">
                <span class="text-slate-400 d-block">Booking / Check-In Time</span>
                <span class="text-slate-300" th:text="${#temporals.format(booking.entryTime, 'dd MMM yyyy, HH:mm:ss')}">Time</span>
            </div>
            <div class="col-6 text-end">
                <span class="text-slate-400 d-block">Parking Rate</span>
                <strong class="text-warning fs-6" th:text="'₹' + ${booking.hourlyRate} + '/hr'">₹20.0/hr</strong>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="footer-box d-flex justify-content-between align-items-center">
            <a href="/user/dashboard" class="btn btn-outline-secondary px-3"><i class="fa-solid fa-arrow-left me-1"></i> Dashboard</a>
            <button onclick="window.print()" class="btn btn-glow"><i class="fa-solid fa-print me-1"></i> Print Confirmation</button>
        </div>
    </div>

</body>
</html>
