spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=Smart Parking Management System
server.port=8080

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Override with DB_USERNAME / DB_PASSWORD environment variables outside local development.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Thymeleaf & Web Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# Spring Mail Configuration (SMTP Settings for Email Notifications)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Credentials are NEVER stored in this file. Set them as environment variables:
#   MAIL_USERNAME = Gmail address used to send     MAIL_PASSWORD = Gmail App Password (not your login password)
# If they are empty, the app still works: bookings succeed, dashboard notifications are created,
# and the admin email is skipped with a warning in the log.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ===================================================================
# Initial Admin Bootstrap (only used when no administrator exists)
# ===================================================================
# Set ADMIN_EMAIL and ADMIN_INITIAL_PASSWORD in the environment for a fresh database.
# Existing administrator passwords are never reset on application startup.
app.admin.email=${ADMIN_EMAIL:}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# ===================================================================
# Custom App Upload / Storage Properties
# ===================================================================
app.qr.code.directory=./uploads/qrcodes/
app.pdf.receipt.directory=./uploads/receipts/

# ===================================================================
# Admin Notification Settings
# ===================================================================
# Address(es) that receive "New Parking Booking" / "Parking Completed" emails.
# Comma-separated for several recipients. Leave empty to disable admin emails
# (dashboard notifications are always created).
admin.notification.email=${ADMIN_NOTIFICATION_EMAIL:}
# Optional "From" address. Defaults to MAIL_USERNAME (Gmail requires the sender to be the authenticated account).
admin.notification.from=${ADMIN_NOTIFICATION_FROM:}

# ===================================================================
# Password Reset
# ===================================================================
app.password-reset.expiry-minutes=15
